name: data-sync

# Schedules are UTC (Thailand = UTC+7).
# Hourly (odds + lineups + results + settlement + finished-match details) is dispatched with
# job=hourly by the live-score Worker's "5 * * * *" cron: GitHub's own hourly schedule fired only every 4–7 hours.
on:
  schedule:
    - cron: '30 22 * * *'   # daily 05:30 TH: league seasons, fixtures window, injuries, API predictions, standings, prune raw responses
    - cron: '0 20 * * 1'    # weekly Tue 03:00 TH: player season stats, prune + reclaim disk (vacuum full)
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run (e.g. hourly, bootstrap, odds, details, players)'
        required: true
        default: bootstrap

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      API_FOOTBALL_RPM: ${{ vars.API_FOOTBALL_RPM || '10' }}
      TRACKED_LEAGUES: ${{ vars.TRACKED_LEAGUES || '39,140' }}
      SEASON: ${{ vars.SEASON || '2026' }}
      ODDS_MARKETS: ${{ vars.ODDS_MARKETS || 'MATCH_WINNER,ASIAN_HANDICAP,OVER_UNDER' }}
      ODDS_BOOKMAKERS: ${{ vars.ODDS_BOOKMAKERS || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Manual job
        if: github.event_name == 'workflow_dispatch' && inputs.job != 'hourly'
        run: |
          case "${{ inputs.job }}" in
            odds) npm run sync:odds ;;
            *)    npm run job -w @fp/football-sync -- "${{ inputs.job }}" ;;
          esac

      # A failed step no longer stops the steps after it (audit A-11): one failed odds fetch used to leave the
      # hour without settlement and publishing. Each later step guards itself (stale odds and old model runs are
      # rejected by the pick rules), and the run still fails at the end, listing every failed step.
      - name: Hourly
        if: inputs.job == 'hourly'
        run: |
          failed=()
          step() { echo "::group::$*"; if ! "$@"; then failed+=("$*"); echo "::error::step failed: $*"; fi; echo "::endgroup::"; }
          step npm run sync:lineups -- --minutes 75
          step npm run sync:odds
          step npm run sync:results
          step npm run model:settle
          step npm run model:closing
          step npm run sync:details
          step npm run model:probabilities -- --days 2
          npm run model:qualification || echo "::warning::qualification job failed (optional step, the run goes on)"
          step npm run model:impact -- --hours 36
          step npm run model:candidates -- --hours 36
          step npm run model:publish
          step npm run model:featured
          step npm run model:pick-notes
          step npm run model:ai-shadow
          if [ ${#failed[@]} -gt 0 ]; then printf 'failed step: %s\n' "${failed[@]}"; exit 1; fi

      - name: Daily
        if: github.event.schedule == '30 22 * * *'
        run: |
          failed=()
          step() { echo "::group::$*"; if ! "$@"; then failed+=("$*"); echo "::error::step failed: $*"; fi; echo "::endgroup::"; }
          step npm run sync:leagues
          step npm run sync:fixtures -- --from "$(date -u +%F)" --to "$(date -u -d '+10 days' +%F)"
          step npm run sync:results
          step npm run model:settle
          step npm run sync:injuries -- --days 3
          step npm run sync:details -- --limit 400
          step npm run sync:predictions -- --hours 48
          step npm run sync:standings
          step npm run sync:support
          step npm run model:probabilities -- --days 7
          step npm run model:closing
          step npm run db:prune
          if [ ${#failed[@]} -gt 0 ]; then printf 'failed step: %s\n' "${failed[@]}"; exit 1; fi

      # Once a day, on GitHub's own schedule (not the Worker's hourly dispatch), so it also notices when the hourly
      # pipeline stops running altogether. A PROBLEM fails the run, and GitHub e-mails the failure (audit A-11).
      - name: Health
        if: always() && github.event.schedule == '30 22 * * *'
        run: npm run model:health

      - name: Weekly
        if: github.event.schedule == '0 20 * * 1'
        run: |
          npm run sync:players
          npm run db:prune -- --vacuum

  # Tuning every league takes longer than the 30 minutes of the sync job: the weekly run of 2026-10-19 was cut off
  # part way (only some leagues re-tuned, its sync_runs row left RUNNING). Own job, after the weekly sync (the
  # vacuum locks tables), with room to finish.
  tune:
    needs: sync
    if: always() && github.event.schedule == '0 20 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TRACKED_LEAGUES: ${{ vars.TRACKED_LEAGUES || '39,140' }}
      SEASON: ${{ vars.SEASON || '2026' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run model:tune

  # The written previews take one AI call (~75 s) per match; at the end of the sync job they overran its 30 minutes.
  # Own job: nearest kickoffs first, and it stops starting new previews after 24 minutes so it ends by itself.
  preview:
    if: inputs.job == 'hourly'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      TRACKED_LEAGUES: ${{ vars.TRACKED_LEAGUES || '39,140' }}
      SEASON: ${{ vars.SEASON || '2026' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run model:preview -- --hours 48 --budget-minutes 24
