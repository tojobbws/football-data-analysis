name: data-sync

# Schedules are UTC (Thailand = UTC+7).
# Hourly (odds + lineups + results + settlement + finished-match details) is dispatched with
# job=hourly by the live-score Worker's "5 * * * *" cron: GitHub's own hourly schedule fired only every 4–7 hours.
on:
  schedule:
    - cron: '30 22 * * *'   # daily 05:30 TH: league seasons, fixtures window, injuries, API predictions, standings, prune raw responses
    - cron: '0 20 * * 1'    # weekly Tue 03:00 TH: player season stats, prune + reclaim disk (vacuum full)
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run (e.g. hourly, bootstrap, odds, details, players)'
        required: true
        default: bootstrap

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      API_FOOTBALL_RPM: ${{ vars.API_FOOTBALL_RPM || '10' }}
      TRACKED_LEAGUES: ${{ vars.TRACKED_LEAGUES || '39,140' }}
      SEASON: ${{ vars.SEASON || '2026' }}
      ODDS_MARKETS: ${{ vars.ODDS_MARKETS || 'MATCH_WINNER,ASIAN_HANDICAP,OVER_UNDER' }}
      ODDS_BOOKMAKERS: ${{ vars.ODDS_BOOKMAKERS || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Manual job
        if: github.event_name == 'workflow_dispatch' && inputs.job != 'hourly'
        run: |
          case "${{ inputs.job }}" in
            odds) npm run sync:odds ;;
            *)    npm run job -w @fp/football-sync -- "${{ inputs.job }}" ;;
          esac

      - name: Hourly
        if: inputs.job == 'hourly'
        run: |
          npm run sync:lineups -- --minutes 75
          npm run sync:odds
          npm run sync:results
          npm run model:settle
          npm run model:closing
          npm run sync:details
          npm run model:probabilities -- --days 2
          npm run model:qualification || echo "::warning::qualification job failed (optional step, the run goes on)"
          npm run model:impact -- --hours 36
          npm run model:candidates -- --hours 36
          npm run model:publish
          npm run model:featured
          npm run model:pick-notes
          npm run model:ai-shadow

      - name: Daily
        if: github.event.schedule == '30 22 * * *'
        run: |
          npm run sync:leagues
          npm run sync:fixtures -- --from "$(date -u +%F)" --to "$(date -u -d '+10 days' +%F)"
          npm run sync:results
          npm run model:settle
          npm run sync:injuries -- --days 3
          npm run sync:details -- --limit 400
          npm run sync:predictions -- --hours 48
          npm run sync:standings
          npm run sync:support
          npm run model:probabilities -- --days 7
          npm run model:closing
          npm run db:prune

      - name: Weekly
        if: github.event.schedule == '0 20 * * 1'
        run: |
          npm run sync:players
          npm run model:tune
          npm run db:prune -- --vacuum

  # The written previews take one AI call (~75 s) per match; at the end of the sync job they overran its 30 minutes.
  # Own job: nearest kickoffs first, and it stops starting new previews after 24 minutes so it ends by itself.
  preview:
    if: inputs.job == 'hourly'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      TRACKED_LEAGUES: ${{ vars.TRACKED_LEAGUES || '39,140' }}
      SEASON: ${{ vars.SEASON || '2026' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run model:preview -- --hours 48 --budget-minutes 24
