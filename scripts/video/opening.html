<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Daily Opening</title>
<style>
@font-face{font-family:Plex;font-weight:600;src:url(assets/fonts/ibm-plex-sans-thai-thai-600-normal.woff2) format('woff2');unicode-range:U+0E00-0E7F}
@font-face{font-family:Plex;font-weight:700;src:url(assets/fonts/ibm-plex-sans-thai-thai-700-normal.woff2) format('woff2');unicode-range:U+0E00-0E7F}
@font-face{font-family:Plex;font-weight:600;src:url(assets/fonts/ibm-plex-sans-thai-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-024F,U+2000-206F}
@font-face{font-family:Plex;font-weight:700;src:url(assets/fonts/ibm-plex-sans-thai-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-024F,U+2000-206F}
@font-face{font-family:Barlow;font-weight:800;src:url(assets/fonts/barlow-condensed-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:Barlow;font-weight:900;src:url(assets/fonts/barlow-condensed-latin-900-normal.woff2) format('woff2')}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#030817}
#film{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 70% at 50% 38%,#10306e 0%,#0a1b45 38%,#050d24 70%,#02060f 100%);font-family:Plex,sans-serif;color:#fff}
#stage{position:absolute;inset:0;transform-origin:540px 800px}
.beam{position:absolute;top:-300px;width:520px;height:2300px;transform-origin:50% 0;mix-blend-mode:screen;filter:blur(28px)}
.beam.b{background:linear-gradient(180deg,rgba(90,150,255,.5),rgba(60,110,255,.1) 55%,rgba(0,0,0,0) 80%)}
.beam.g{background:linear-gradient(180deg,rgba(255,196,80,.5),rgba(255,160,40,.1) 55%,rgba(0,0,0,0) 80%)}
#world{position:absolute;inset:0;perspective:1500px;perspective-origin:540px 900px}
#pitch{position:absolute;left:200px;top:500px;width:680px;height:1050px;opacity:.55}
#compass{position:absolute;left:465px;top:96px;width:150px;height:150px;z-index:8}
#compass img{width:100%;height:100%;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6))}
#head{position:absolute;left:0;width:1080px;top:272px;text-align:center;z-index:8}
#head .pill{position:relative;display:inline-block;padding:18px 50px 20px;border-radius:999px;background:linear-gradient(180deg,#ffd166,#f59e0b 60%,#d9730a);color:#1a0d00;font-weight:700;font-size:66px;line-height:1.1;box-shadow:0 8px 0 #7a3a04,0 20px 50px rgba(245,158,11,.45);overflow:hidden;white-space:nowrap}
#head .pill::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.7) 50%,rgba(255,255,255,0) 65%);transform:translateX(var(--sheen,-120%))}
#date{position:absolute;left:0;width:1080px;top:418px;text-align:center;z-index:8;font-weight:700;font-size:64px;line-height:1.2;color:#fff;text-shadow:0 4px 0 #04102e,0 10px 30px rgba(0,0,0,.7)}
#date b{color:#ffc53d}
.ghead{position:absolute;left:60px;width:960px;height:86px;display:flex;align-items:center;gap:20px;z-index:8}
.ghead .lg{width:86px;height:86px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#fff,#dfe7f4);box-shadow:0 0 0 5px #5b8cff,0 10px 24px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.ghead .lg img{width:68%;height:68%;object-fit:contain}
.ghead .nm{font-weight:700;font-size:46px;color:#dbe6ff;text-shadow:0 4px 18px rgba(0,0,0,.7);white-space:nowrap}
.ghead .ln{flex:1;height:4px;border-radius:2px;background:linear-gradient(90deg,rgba(251,191,36,.9),rgba(251,191,36,0));transform-origin:0 50%}
.rowc{position:absolute;left:60px;width:960px;height:182px;z-index:8;perspective:1200px}
.rowc .in{position:absolute;inset:0;border-radius:30px;background:linear-gradient(180deg,rgba(16,36,86,.9),rgba(6,14,38,.94));box-shadow:inset 0 0 0 2px rgba(120,160,255,.35),0 24px 60px rgba(0,0,0,.5);display:grid;grid-template-columns:380px 200px 380px;align-items:center;overflow:hidden}
.rowc .in::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.16) 50%,rgba(255,255,255,0) 65%);transform:translateX(var(--sheen,-120%))}
.team{display:flex;flex-direction:column;align-items:center;gap:8px}
.team .d{width:112px;height:112px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#fff,#e3eaf6);box-shadow:0 0 0 6px #f6b72a,0 0 0 10px #8a4b06,0 10px 24px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.team .d img{width:70%;height:70%;object-fit:contain}
.team .n{font-family:Barlow;font-weight:800;font-size:36px;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;line-height:1}
.mid{text-align:center}
.mid .vs{font-family:Barlow;font-weight:900;font-style:italic;font-size:76px;line-height:1;background:linear-gradient(180deg,#fff3c4,#fbbf24 45%,#ea7a12);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 0 #7a3a04)}
.mid .ko{margin-top:8px;font-weight:600;font-size:28px;color:#9fb3e0;white-space:nowrap}
#subbg{position:absolute;left:0;top:1380px;width:1080px;height:360px;z-index:19;background:radial-gradient(60% 50% at 50% 50%,rgba(2,6,20,.72),rgba(2,6,20,0))}
#sub{position:absolute;left:60px;top:1446px;width:960px;z-index:20;text-align:center;font-weight:700;font-size:62px;line-height:1.34;text-shadow:0 4px 0 #04102e,0 0 2px #04102e,0 10px 28px rgba(0,0,0,.8)}
#sub .hi{display:inline-block}
#sub .hi.on{color:#ffc53d;text-shadow:0 4px 0 #5a2a00,0 0 28px rgba(255,170,40,.65)}
#sub .ul{display:block;margin:12px auto 0;height:8px;width:260px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
#sub .ul i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#ffd166);border-radius:4px}
canvas{position:absolute;left:0;top:0}
#fx{z-index:15}#grain{z-index:30;opacity:.07;mix-blend-mode:overlay}
#flash{position:absolute;inset:0;z-index:25;background:radial-gradient(circle at 50% 30%,#fff6d8,#ffcc66 40%,rgba(255,170,40,0) 75%);mix-blend-mode:screen;opacity:0}
#vig{position:absolute;inset:0;z-index:28;background:radial-gradient(130% 85% at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
#exitfade{position:absolute;inset:0;z-index:29;background:#02060f;opacity:0}
</style>
</head>
<body>
<div id="film">
  <div id="stage">
    <div class="beam b" id="bm1"></div><div class="beam g" id="bm2"></div><div class="beam b" id="bm3"></div><div class="beam g" id="bm4"></div>
    <div id="world"><div id="pitch"><svg id="psvg" viewBox="0 0 680 1050" width="680" height="1050"></svg></div></div>
    <div id="compass"><img src="brand/compass-mark.webp"></div>
    <div id="head"><div class="pill">คู่น่าจับตาวันนี้</div></div>
    <div id="date"></div>
    <div id="list"></div>
  </div>
  <canvas id="fx" width="1080" height="1920"></canvas>
  <div id="subbg"></div><div id="sub"></div>
  <div id="flash"></div><div id="vig"></div><div id="exitfade"></div>
  <canvas id="grain" width="540" height="960" style="width:1080px;height:1920px"></canvas>
</div>
<script src="cover.js"></script>
<script>
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));const lerp=(a,b,u)=>a+(b-a)*u;const prog=(t,a,b)=>clamp((t-a)/(b-a));
const io=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;const o5=u=>1-Math.pow(1-u,5);
function spring(t,f=1.6,z=.72){if(t<=0)return 0;const w=2*Math.PI*f;const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+(z*w/wd)*Math.sin(wd*t));}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const $=id=>document.getElementById(id);
// the film can open on a cover (0 -> C, cover.js); subs, scenes and exitAt run on the story clock, TL.T is the whole clip
const TL=window.TL,M=TL.match,C=TL.cover||0,T=TL.T-C,subs=TL.subs;const at=i=>subs[Math.min(i,subs.length-1)].t0;
const esc=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;');
$('date').innerHTML=M.date_th.replace(/(\d+ \S+)/,'<b>$1</b>');
// pitch (background, dim)
const NS='http://www.w3.org/2000/svg';const ps=$('psvg');
function el(tag,a,p=ps){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;}
el('rect',{x:-26,y:-26,width:732,height:1102,rx:22,fill:'#07142f',stroke:'#fbbf24','stroke-width':6});
for(let i=0;i<12;i++)el('rect',{x:0,y:i*87.5,width:680,height:87.5,fill:i%2?'#0d4a45':'#0b403c'});
const L={fill:'none',stroke:'rgba(235,245,255,.7)','stroke-width':4};
el('rect',{x:20,y:20,width:640,height:1010,...L});el('line',{x1:20,y1:525,x2:660,y2:525,...L});el('circle',{cx:340,cy:525,r:92,...L});
for(const top of [true,false]){el('rect',{x:138,y:top?20:865,width:404,height:165,...L});el('rect',{x:248,y:top?20:975,width:184,height:55,...L});}
// list layout
const list=$('list');const items=[];
// stack groups and rows from y=544; shrink the whole list when it would run into the subtitles (y=1390)
let y=544;const tops={g:[],r:[]};M.groups.forEach((g,gi)=>{if(gi)y+=30;tops.g.push(y);y+=106;tops.r.push(g.rows.map(()=>{const v=y;y+=200;return v;}));});
const listScale=Math.min(1,(1390-544)/(y-20-544));list.style.cssText=`position:absolute;inset:0;transform-origin:540px 544px;transform:scale(${listScale})`;
M.groups.forEach((g,gi)=>{
  const h=document.createElement('div');h.className='ghead';h.style.top=tops.g[gi]+'px';
  h.innerHTML=`<div class="lg"><img src="${g.logo}"></div><div class="nm">${esc(g.league)}</div><div class="ln"></div>`;list.appendChild(h);items.push({el:h,kind:'g',t0:at(g.at)});
  g.rows.forEach((r,ri)=>{const c=document.createElement('div');c.className='rowc';c.style.top=tops.r[gi][ri]+'px';
    const fs=n=>n.length>14?30:36;
    c.innerHTML=`<div class="in"><div class="team"><div class="d"><img src="${r.home.logo}"></div><div class="n" style="font-size:${fs(r.home.name)}px">${esc(r.home.name)}</div></div><div class="mid"><div class="vs">VS</div><div class="ko">${esc(r.kickoff.split(' · ')[0])}</div></div><div class="team"><div class="d"><img src="${r.away.logo}"></div><div class="n" style="font-size:${fs(r.away.name)}px">${esc(r.away.name)}</div></div></div>`;
    list.appendChild(c);items.push({el:c,kind:'r',t0:at(r.at),side:ri%2});});
});
// fx
const fx=$('fx').getContext('2d'),gr=$('grain').getContext('2d');const rnd0=mulberry(9);
const embers=Array.from({length:70},()=>({x:rnd0()*1080,y:rnd0()*1920,v:30+rnd0()*80,r:1.5+rnd0()*3.5,ph:rnd0()*6.28,gold:rnd0()<.7}));
const burst=Array.from({length:70},()=>({a:rnd0()*Math.PI*2,v:400+rnd0()*1000,r:2+rnd0()*4,life:.6+rnd0()*.7}));
function bez(p,u){const [a,b,c,d]=p;const m=1-u;return [m*m*m*a[0]+3*m*m*u*b[0]+3*m*u*u*c[0]+u*u*u*d[0],m*m*m*a[1]+3*m*m*u*b[1]+3*m*u*u*c[1]+u*u*u*d[1]];}
function trail(p,head,len,width,color){const N=26;fx.lineCap='round';for(let i=0;i<N;i++){const u0=head-len*(1-i/N),u1=head-len*(1-(i+1)/N);if(u1<0||u0>1)continue;const a=bez(p,clamp(u0)),b=bez(p,clamp(u1));const k=(i+1)/N;fx.strokeStyle=color.replace('A',(k*k*.9).toFixed(3));fx.lineWidth=width*k;fx.beginPath();fx.moveTo(a[0],a[1]);fx.lineTo(b[0],b[1]);fx.stroke();}
  const h=bez(p,clamp(head));if(head>0&&head<1.05){const g=fx.createRadialGradient(h[0],h[1],0,h[0],h[1],width*3);g.addColorStop(0,color.replace('A','0.9'));g.addColorStop(1,color.replace('A','0'));fx.fillStyle=g;fx.beginPath();fx.arc(h[0],h[1],width*3,0,7);fx.fill();}}
const introTrails=[{p:[[-200,700],[200,500],[400,420],[540,330]],t0:.0,c:'rgba(255,190,70,A)'},{p:[[1280,700],[880,500],[680,420],[540,330]],t0:.08,c:'rgba(255,190,70,A)'},{p:[[-100,1400],[300,1100],[700,1200],[1200,900]],t0:.2,c:'rgba(110,170,255,A)'}];
const exitTrails=[{p:[[-200,1300],[300,1200],[700,1000],[1300,600]],t0:0,c:'rgba(255,190,70,A)'},{p:[[1300,1500],[800,1200],[400,1000],[-200,700]],t0:.08,c:'rgba(110,170,255,A)'},{p:[[-200,500],[400,700],[700,900],[1300,1100]],t0:.16,c:'rgba(255,210,120,A)'}];
const subEl=$('sub');let lastSub=-1;
function subHTML(s){const h=s.show;const marks=[];for(const w of s.hi){const i=h.indexOf(w);if(i>=0)marks.push([i,w]);}marks.sort((a,b)=>a[0]-b[0]);let o='',c=0;for(const [i,w] of marks){if(i<c)continue;o+=esc(h.slice(c,i))+`<span class="hi" data-f="${(i+w.length*.3)/h.length}">${esc(w)}</span>`;c=i+w.length;}return o+esc(h.slice(c))+'<span class="ul"><i></i></span>';}
const T0=at(0);const impacts=[[T0+.05,.035],...items.filter(x=>x.kind==='r').map(x=>[x.t0+.25,.018])];
const cover=makeCover({C,title:'คู่น่าจับตาวันนี้',dateHTML:esc(M.date_th).replace(/(\d+ \S+)/,'<b>$1</b>'),pairs:M.groups.flatMap(g=>g.rows),before:$('vig')});
window.seek=function(tf){story(Math.max(0,tf-C));cover(tf);};
function story(t){
  let punch=0;for(const [ti,a] of impacts)if(t>=ti)punch+=a*Math.exp(-(t-ti)*7);
  const ex=TL.exitAt!=null?io(prog(t,TL.exitAt,T)):0;
  $('stage').style.transform=`scale(${(1+.05*prog(t,0,T))*(1+punch)*(1+.12*ex)})`;
  [['bm1',-60,-14],['bm2',240,10],['bm3',560,-8],['bm4',820,16]].forEach(([id,x,a],i)=>{$(id).style.transform=`translateX(${x}px) rotate(${a+Math.sin(t*.7+i*1.7)*9}deg)`;$(id).style.opacity=clamp(.35+.25*Math.sin(t*1.3+i))*prog(t,0,.6);});
  const pe=o5(prog(t,0,1.4));$('pitch').style.transform=`rotateX(${lerp(72,62,pe)}deg) rotateZ(${lerp(-60,-38,pe)+t*2}deg) scale(${lerp(.6,.95,pe)})`;$('pitch').style.opacity=.5*prog(t,0,.8);
  const ck=spring(t-T0+.25,1.4,.7);$('compass').style.transform=`scale(${clamp(ck,0,1.2)}) rotate(${(1-Math.exp(-Math.max(0,t-T0+.25)*2))*720}deg)`;$('compass').style.opacity=clamp(ck*2);
  const hk=spring(t-T0+.1,1.5,.7);$('head').style.transform=`translateY(${(1-hk)*-140}px) scale(${.8+.2*hk})`;$('head').style.opacity=clamp(hk*2);
  $('head').querySelector('.pill').style.setProperty('--sheen',(-120+240*io(prog(t,T0+.5,T0+1.3)))+'%');
  const dk=spring(t-at(1),1.6,.75);$('date').style.transform=`translateY(${(1-dk)*50}px)`;$('date').style.opacity=clamp(dk*2);
  for(const it of items){const k=spring(t-it.t0,1.5,.72);
    if(it.kind==='g'){it.el.style.opacity=clamp(k*2);it.el.style.transform=`translateX(${(1-k)*-120}px)`;it.el.querySelector('.ln').style.transform=`scaleX(${o5(prog(t,it.t0+.1,it.t0+.8))})`;}
    else{const inn=it.el.querySelector('.in');it.el.style.opacity=clamp(k*2);inn.style.transform=`translateX(${(1-k)*(it.side?-260:260)}px) rotateY(${(1-k)*(it.side?40:-40)}deg)`;inn.style.setProperty('--sheen',(-120+240*io(prog(t,it.t0+.3,it.t0+1.1)))+'%');
      it.el.querySelectorAll('.d').forEach((d,j)=>{const kd=spring(t-it.t0-.12-j*.1,2,.6);d.style.transform=`scale(${clamp(kd,0,1.3)})`;});
      it.el.querySelector('.vs').style.transform=`scale(${lerp(2,1,clamp(spring(t-it.t0-.25,2,.55),0,1.3))})`;}
  }
  fx.clearRect(0,0,1080,1920);fx.globalCompositeOperation='lighter';
  for(const tr of introTrails){const h=o5(prog(t,T0-.35+tr.t0,T0+.45+tr.t0))*1.25;if(h>0&&h<1.25)trail(tr.p,h,.45,10,tr.c);}
  if(TL.exitAt!=null)for(const tr of exitTrails){const h=o5(prog(t,TL.exitAt-.25+tr.t0,TL.exitAt+.45+tr.t0))*1.3;if(h>0&&h<1.3)trail(tr.p,h,.5,12,tr.c);}
  for(const it of items.filter(x=>x.kind==='r')){const y=parseFloat(it.el.style.top)+91;const p=[[it.side?-150:1230,y-120],[it.side?300:780,y-60],[it.side?600:480,y+40],[it.side?1250:-170,y+20]];const h=o5(prog(t,it.t0-.05,it.t0+.6))*1.3;if(h>0&&h<1.3)trail(p,h,.5,8,'rgba(255,200,90,A)');}
  for(const e of embers){const y=((e.y-t*e.v)%1960+1960)%1960-20;const x=e.x+Math.sin(t*1.2+e.ph)*18;const a=(.35+.35*Math.sin(t*3+e.ph))*prog(t,0,.8);fx.fillStyle=e.gold?`rgba(255,190,80,${a})`:`rgba(130,180,255,${a})`;fx.beginPath();fx.arc(x,y,e.r,0,7);fx.fill();}
  {const dt=t-T0-.05;if(dt>0&&dt<1.6)for(const b of burst){if(dt>b.life)continue;const d=b.v*(1-Math.exp(-dt*3.2))/3.2;const a=1-dt/b.life;fx.fillStyle=`rgba(255,${180+Math.floor(60*a)},90,${a})`;fx.beginPath();fx.arc(540+Math.cos(b.a)*d,330+Math.sin(b.a)*d*.8+dt*dt*120,b.r*(1+a),0,7);fx.fill();}}
  fx.globalCompositeOperation='source-over';
  $('flash').style.opacity=t>=T0+.05?Math.exp(-(t-T0-.05)*9)*.5:0;
  $('exitfade').style.opacity=ex;
  let cur=-1;for(let i=0;i<subs.length;i++){const s=subs[i];const end=i+1<subs.length?Math.min(subs[i+1].t0,s.t1+.6):s.t1+.6;if(t>=s.t0-.06&&t<end)cur=i;}
  if(cur!==lastSub){subEl.innerHTML=cur>=0?subHTML(subs[cur]):'';lastSub=cur;}
  if(cur>=0){const s=subs[cur];const k=spring(t-s.t0+.06,2.2,.75);subEl.style.opacity=clamp(k*2.5);subEl.style.transform=`translateY(${(1-k)*26}px) scale(${.94+.06*clamp(k)})`;const bar=subEl.querySelector('.ul i');if(bar)bar.style.width=prog(t,s.t0,s.t1)*100+'%';subEl.querySelectorAll('.hi').forEach(h=>{h.classList.toggle('on',t>=s.t0+(s.t1-s.t0)*parseFloat(h.dataset.f));});}else subEl.style.opacity=0;
  const r=mulberry(Math.floor(t*30)+5);const im=gr.createImageData(540,960);const d=im.data;for(let i=0;i<d.length;i+=4){const v=r()*255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}gr.putImageData(im,0,0);
}
Promise.all([document.fonts.ready,...[...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))]).then(()=>Promise.all([document.fonts.load('700 60px Plex','คู่'),document.fonts.load('900 60px Barlow','VS'),document.fonts.load('800 60px Barlow','A')])).then(()=>{window.seek(0);window.ready=true;});
</script>
</body>
</html>
